services:

  mongodb:
    image: mongo:7
    container_name: smart-mailbox-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: smart-mailbox-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/smart_mailbox
      JWT_SECRET: supersecretkey
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: smart-mailbox-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongodb_data: