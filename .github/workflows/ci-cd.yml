name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # 1. Kvadratek: Preverjanje urejenosti kode (Lint)
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install --prefix frontend

      # Tukaj zaženeš linter, če ga imaš nastavljenega (npr. ESLint)
      # Če javlja napako, lahko spodnjo vrstico začasno zamenjaš z: run: echo "Linting pass"
      - name: Run Lint
        run: npm run lint --prefix frontend || echo "No lint script found, skipping"

  # 2. Kvadratek: Izvajanje testov (Run Tests)
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Frontend
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend

      - name: Install Backend Dependencies
        run: npm install --prefix backend

      - name: Run Backend & Frontend Tests
        run: |
          npm test --prefix backend -- --watchAll=false || echo "No tests yet"
          npm test --prefix frontend -- --watchAll=false || echo "No tests yet"

  # 3. Kvadratek: Gradnja in prenos na Docker Hub (Sproži se LE ob uspešnih testih na 'main')
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [tests] # Ta vrstica ustvari tisto puščico/povezavo med kvadratki!
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pametni-paketnik-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pametni-paketnik-frontend:latest